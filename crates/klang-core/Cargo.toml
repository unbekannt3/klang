[package]
name = "klang-core"
description = "TIDAL client core — API, playback, MPRIS, scrobbling. UI-toolkit agnostic."
authors = ["lullabyX", "klang contributors"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "klang_core"

[dependencies]
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1.0.28"
gstreamer = "0.23"
gstreamer-app = "0.23"
crossbeam-channel = "0.5"
walkdir = "2"
id3 = "1"
reqwest = { version = "0.11", features = ["json", "socks"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.21"
dirs = "5"
rand = "0.10.1"
sha2 = "0.10.9"
md5 = "0.7"
async-trait = "0.1"
log = "0.4"
flexi_logger = "0.31"
thiserror = "2"
aes-gcm = "0.10"
keyring = { version = "3", features = ["sync-secret-service"] }
zeroize = "1"
discord-rich-presence = "1.1"
zbus = "5"
rmcp = { version = "1.7.0", features = ["server", "transport-streamable-http-server", "macros"] }
schemars = "1"
axum = "0.7"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.9"
alsa = "0.10"
libc = "0.2"
ksni = "0.3"
x11rb = { version = "0.13.2", features = ["screensaver", "dpms"] }
wayland-client = { version = "0.31", features = ["dlopen"] }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[dev-dependencies]
tempfile = "3"
