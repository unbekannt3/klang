# Builds every package. Called by CI on each push, and by the release workflow
# on a tag; the artifacts are the same either way, so a build can be picked up
# without cutting a release.
name: Packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git rpm-build rpmdevtools 'dnf-command(builddep)'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # build-rpm.sh archives HEAD, so git has to trust the checkout.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The spec's own BuildRequires is the list, so it cannot drift from what
      # a local rpmbuild needs.
      - name: Install the spec's build dependencies
        run: dnf builddep -y --setopt=install_weak_deps=False packaging/rpm/klang.spec

      - run: scripts/build-rpm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: klang-rpm
          path: dist/*.rpm

  # The deb and Arch builds run in their own distro containers, which the
  # scripts start themselves — hence a plain runner and docker rather than a
  # `container:` job.
  deb:
    runs-on: ubuntu-latest
    env:
      KLANG_CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: scripts/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: klang-deb
          path: dist/*.deb

  arch:
    runs-on: ubuntu-latest
    env:
      KLANG_CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: scripts/build-arch.sh

      - uses: actions/upload-artifact@v4
        with:
          name: klang-arch
          path: dist/*.pkg.tar.*

  flatpak:
    # Not one of the flatpak-github-actions images: they stop at KDE 6.7 and
    # cxx-qt needs the 6.11 runtime to match its private-API linkage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      # The same script the repo uses locally, so the recipe lives in one place.
      - run: scripts/build-flatpak.sh

      - uses: actions/upload-artifact@v4
        with:
          name: klang-flatpak
          path: |
            dist/klang.flatpak
            packaging/flatpak/me.unbk.klang.flatpakref

      # The repo is what a .flatpakref installs from; the release workflow
      # publishes it to Pages.
      - uses: actions/upload-artifact@v4
        with:
          name: klang-flatpak-repo
          path: dist/flatpak-repo
